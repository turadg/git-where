[package]
name = "git-where"
version = "0.3.0"
edition = "2024"
description = "Git extension for navigating repos and worktrees — find files, directories, and branches across projects with frecency-ranked fuzzy selection"
license = "MIT"
repository = "https://github.com/turadg/git-where"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
